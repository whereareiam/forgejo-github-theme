name: Release Build

on:
  release:
    types:
      - created
      - published
  workflow_dispatch:
    inputs:
      release-tag:
        description: Release tag to rebuild and republish, for example v1.28.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.release-tag }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release-tag }}
      - name: Build release assets
        uses: ./.github/actions/build-release-assets
      - name: Upload assets to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.release-tag }}
        run: gh release upload "$RELEASE_TAG" dist/*.tar.gz --clobber
