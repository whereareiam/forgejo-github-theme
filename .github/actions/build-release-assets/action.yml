name: Build release assets
description: Build and package the theme assets used by GitHub Releases and development builds.

inputs:
  bun-version:
    description: Bun version used to build the theme.
    required: false
    default: "1.3.14"

runs:
  using: composite
  steps:
    - name: Set up Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: ${{ inputs.bun-version }}

    - name: Install dependencies
      shell: bash
      run: bun install --frozen-lockfile

    - name: Build and package theme assets
      shell: bash
      run: bash "${{ github.action_path }}/package.sh"
